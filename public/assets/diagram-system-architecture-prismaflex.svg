<svg width="1000" height="400" viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="400" fill="#F6FBFA"/>
  
  <!-- Definitions -->
  <defs>
    <style>
      .node-text { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #102A2C; }
      .label-text { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; fill: #5F7275; }
      .accent-box { fill: #FFFFFF; stroke: #D8E5E4; stroke-width: 1.5; }
      .line { stroke: #D8E5E4; stroke-width: 1.5; }
      .accent-line { stroke: #0F9F98; stroke-width: 2; }
      .arrow { fill: #D8E5E4; }
      .accent-arrow { fill: #0F9F98; }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#D8E5E4" />
    </marker>
    <marker id="accent-arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#0F9F98" />
    </marker>
  </defs>

  <!-- Flow Path -->
  <!-- 1. PrismaFlex -->
  <g transform="translate(50, 150)">
    <rect width="120" height="60" rx="8" class="accent-box" />
    <text x="60" y="35" text-anchor="middle" class="node-text">PrismaFlex</text>
    <text x="60" y="75" text-anchor="middle" class="label-text">CRRT Machine</text>
  </g>

  <!-- 2. Collector -->
  <g transform="translate(220, 150)">
    <rect width="120" height="60" rx="8" class="accent-box" />
    <text x="60" y="35" text-anchor="middle" class="node-text">Collector</text>
    <text x="60" y="75" text-anchor="middle" class="label-text">Device Interface</text>
  </g>

  <!-- 3. Mirth Connect -->
  <g transform="translate(390, 150)">
    <rect width="120" height="60" rx="8" class="accent-box" />
    <text x="60" y="35" text-anchor="middle" class="node-text">Mirth Connect</text>
    <text x="60" y="75" text-anchor="middle" class="label-text">Normalization</text>
  </g>

  <!-- 4. FastAPI -->
  <g transform="translate(560, 150)">
    <rect width="120" height="60" rx="8" class="accent-box" style="stroke: #0F9F98;"/>
    <text x="60" y="35" text-anchor="middle" class="node-text">FastAPI</text>
    <text x="60" y="75" text-anchor="middle" class="label-text">Backend Engine</text>
  </g>

  <!-- 5. ICU Console -->
  <g transform="translate(730, 150)">
    <rect width="120" height="60" rx="8" class="accent-box" style="stroke: #0F9F98; fill: #D8F2F0;"/>
    <text x="60" y="35" text-anchor="middle" class="node-text">ICU Console</text>
    <text x="60" y="75" text-anchor="middle" class="label-text">Monitoring UI</text>
  </g>

  <!-- 6. EMR / HIS -->
  <g transform="translate(900, 150)">
    <rect width="80" height="60" rx="8" class="accent-box" />
    <text x="40" y="35" text-anchor="middle" class="node-text">EMR/HIS</text>
    <text x="40" y="75" text-anchor="middle" class="label-text">Data Sink</text>
  </g>

  <!-- Connections -->
  <line x1="170" y1="180" x2="215" y2="180" class="line" marker-end="url(#arrowhead)" />
  <line x1="340" y1="180" x2="385" y2="180" class="line" marker-end="url(#arrowhead)" />
  <line x1="510" y1="180" x2="555" y2="180" class="line" marker-end="url(#arrowhead)" />
  <line x1="680" y1="180" x2="725" y2="180" class="accent-line" marker-end="url(#accent-arrowhead)" />
  <line x1="850" y1="180" x2="895" y2="180" class="line" marker-end="url(#arrowhead)" />

  <!-- Annotations -->
  <text x="500" y="50" text-anchor="middle" class="node-text" style="font-size: 18px; fill: #0B7D77;">System Architecture</text>
  <text x="500" y="350" text-anchor="middle" class="label-text" style="font-style: italic;">Real-time clinical telemetry pipeline for PrismaFlex CRRT</text>

  <!-- Secondary Path: DB -->
  <g transform="translate(560, 260)">
    <rect width="120" height="40" rx="4" fill="#FFFFFF" stroke="#D8E5E4" stroke-dasharray="4 2" />
    <text x="60" y="25" text-anchor="middle" class="label-text" style="font-weight: bold;">Audit Database</text>
  </g>
  <line x1="620" y1="210" x2="620" y2="255" class="line" stroke-dasharray="4 2" marker-end="url(#arrowhead)" />

</svg>
