<svg viewBox="0 0 800 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Define Gradients and Assets -->
  <defs>
    <linearGradient id="grad_teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A7A75" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0A7A75" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <shadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Horizontal Layer Tracks -->
  <rect x="20" y="40" width="760" height="80" rx="16" fill="url(#grad_teal)"/>
  <rect x="20" y="140" width="760" height="80" rx="16" fill="#F8FAF9"/>
  <rect x="20" y="240" width="760" height="80" rx="16" fill="url(#grad_teal)"/>

  <!-- Logic Connectors (Line Trace) -->
  <path d="M120 120 V140" stroke="#0A7A75" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M320 120 V140" stroke="#0A7A75" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M520 120 V140" stroke="#0A7A75" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M720 120 V140" stroke="#0A7A75" stroke-width="2" stroke-dasharray="4 4"/>

  <path d="M120 220 V240" stroke="#0A7A75" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M320 220 V240" stroke="#0A7A75" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M520 220 V240" stroke="#0A7A75" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M720 220 V240" stroke="#0A7A75" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Layer Labeling -->
  <text x="40" y="30" font-family="var(--font-mono), monospace" font-size="10" fill="#0A7A75" font-weight="600" letter-spacing="0.1em">INGESTION & EVENT STREAM</text>
  <text x="40" y="130" font-family="var(--font-mono), monospace" font-size="10" fill="#0C1A1B" font-weight="600" letter-spacing="0.1em">CLINICAL AUDIT & STATE</text>
  <text x="40" y="230" font-family="var(--font-mono), monospace" font-size="10" fill="#0A7A75" font-weight="600" letter-spacing="0.1em">DURABLE RECORDS & ANALYTICS</text>

  <!-- Node: Device Event -->
  <rect x="60" y="60" width="120" height="40" rx="8" fill="white" stroke="#E6EBEA"/>
  <text x="75" y="85" font-family="var(--font-sans), sans-serif" font-size="11" font-weight="600" fill="#0C1A1B">Machine Signal</text>

  <!-- Node: State change -->
  <rect x="260" y="160" width="120" height="40" rx="20" fill="#0A7A75" stroke="#0A7A75" filter="url(#shadow)"/>
  <text x="282" y="185" font-family="var(--font-sans), sans-serif" font-size="11" font-weight="600" fill="white">Audit Event</text>

  <!-- Node: Decision -->
  <rect x="460" y="160" width="120" height="40" rx="8" fill="white" stroke="#0A7A75" stroke-width="1.5"/>
  <text x="480" y="185" font-family="var(--font-sans), sans-serif" font-size="11" font-weight="600" fill="#0C1A1B">Nurse Review</text>

  <!-- Node: Permanent DB -->
  <rect x="660" y="260" width="120" height="40" rx="8" fill="white" stroke="#E6EBEA"/>
  <text x="680" y="285" font-family="var(--font-sans), sans-serif" font-size="11" font-weight="600" fill="#0C1A1B">Secure Ledger</text>

  <!-- Annotation Bubbles -->
  <circle cx="580" cy="180" r="14" fill="#0A7A75" fill-opacity="0.1"/>
  <path d="M576 180 L584 180 M580 176 L580 184" stroke="#0A7A75" stroke-width="1.5"/>
</svg>
